services:
  neoforge:
    image: eclipse-temurin:21-jre-jammy
    container_name: neoforge-server
    user: "1000:1000"
    working_dir: /server
    command: bash entrypoint.sh
    ports:
      - "25565:25565"
    volumes:
      - ./server_data:/server
    stdin_open: true
    tty: true
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
