services:
  neoforge:
    image: eclipse-temurin:21-jre-jammy
    container_name: neoforge-server
    working_dir: /server
    command: bash entrypoint.sh
    ports:
      - "25565:25565"
    volumes:
      - ./server_data:/server
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    stdin_open: true
    tty: true
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow